<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#192338"><title>PlayZ Sports</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101725;color:#f5f7fc;font-family:Arial,sans-serif}
header{background:#192338;padding:20px;position:sticky;top:0;font-size:24px;font-weight:bold;z-index:2}
header span{color:#8297ff}main{max-width:900px;margin:auto;padding:12px 14px 60px}
.sports,.filters{display:flex;gap:10px;overflow:auto;padding:10px 0 15px}
.sport{flex:0 0 75px;background:none;border:0;color:white;display:grid;justify-items:center;gap:7px}
.sport i{font-style:normal;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#0b1320;border:2px solid transparent;font-size:26px}
.sport.active i{border-color:#506dff}.filter{white-space:nowrap;border:1px solid #4a566b;border-radius:25px;padding:10px 16px;background:none;color:white}
.filter.active{border:2px solid #506dff}.bar{display:flex;justify-content:space-between;margin:8px 0 12px;font-size:14px}
#updated{font-size:11px;color:#9aa8bd}.events{display:grid;gap:10px}
.card{background:#141e2c;border:1px solid #39465b;border-radius:16px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.league{text-align:center;font-size:13px}.match{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;flex:1}
.team{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13px;font-weight:bold}
.badge{width:48px;height:48px;object-fit:contain;border-radius:50%;background:#24334b;padding:3px}
.emoji{width:48px;height:48px;border-radius:50%;background:#24334b;display:grid;place-items:center;font-size:24px}
.score{text-align:center;display:grid;gap:7px;font-weight:bold}.status{font-size:11px;color:#f36b85}.scoreline{font-size:18px}
.meta{text-align:center;font-size:11px;color:#9aa8bd}.empty{text-align:center;padding:28px;color:#aab5c8;background:#151f30;border-radius:12px}
#credit{text-align:center;margin:18px;font-size:12px}#credit a{color:#dce5ff}
@media(min-width:650px){.events{grid-template-columns:1fr 1fr}}
</style></head><body>
<header>PlayZ <span>Sports</span></header><main>
<div class="sports">
<button class="sport active" data-sport="all"><i>◉</i>All</button>
<button class="sport" data-sport="football"><i>⚽</i>Football</button>
<button class="sport" data-sport="cricket"><i>🏏</i>Cricket</button>
<button class="sport" data-sport="basketball"><i>🏀</i>Basketball</button>
<button class="sport" data-sport="tennis"><i>🎾</i>Tennis</button>
</div>
<div class="filters">
<button class="filter active" data-filter="all">✓ All</button>
<button class="filter" data-filter="live">🔴 Live</button>
<button class="filter" data-filter="scheduled">◷ Upcoming</button>
<button class="filter" data-filter="finished">✓ Finished</button>
</div>
<div class="bar"><span id="heading">All sports</span><span id="updated">Loading…</span></div>
<div class="events" id="events"><div class="empty">Loading sports data…</div></div>
<div id="credit"><a href="https://sportscore.com/" rel="dofollow">Powered by SportScore</a></div>
</main>
<script>
const API="https://sportscore.com/api/widget/matches/";
const sports=["football","cricket","basketball","tennis"];
const icons={football:"⚽",cricket:"🏏",basketball:"🏀",tennis:"🎾"};
let data=[],sport="all",filter="all";
const $=id=>document.getElementById(id);
function val(o,keys,def=""){for(const k of keys)if(o&&o[k]!=null&&o[k]!=="")return o[k];return def}
function normalize(x,s){
 const h=x.home_team||x.home||x.team_home||{},a=x.away_team||x.away||x.team_away||{};
 const st=String(val(x,["status","match_status","state"],"scheduled")).toLowerCase();
 const live=/live|in.?play|1h|2h|quarter|set|inning/.test(st),done=/finish|ended|complete|\\bft\\b|final/.test(st);
 const score=x.score||{};
 return {sport:s,league:val(x,["competition_name","league_name","league","tournament"],s),
 home:typeof h==="string"?h:val(h,["name","team_name","strTeam"],val(x,["home_name"],"Home")),
 away:typeof a==="string"?a:val(a,["name","team_name","strTeam"],val(x,["away_name"],"Away")),
 hl:val(h,["logo","image","badge","strBadge"],val(x,["home_logo"],"")),
 al:val(a,["logo","image","badge","strBadge"],val(x,["away_logo"],"")),
 hs:val(score,["home","home_score"],val(x,["home_score","score_home"],"")),
 as:val(score,["away","away_score"],val(x,["away_score","score_away"],"")),
 state:live?"live":done?"finished":"scheduled",status:val(x,["status","match_status"],live?"LIVE":done?"FT":"Upcoming"),
 date:val(x,["start_time","date","match_date","utc_date"],"")};
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function team(n,l,e){return `<div class="team">${l?`<img class="badge" src="${esc(l)}" alt="" onerror="this.remove()">`:`<div class="emoji">${e}</div>`}<span>${esc(n)}</span></div>`}
function render(){
 let rows=data.filter(m=>(sport==="all"||m.sport===sport)&&(filter==="all"||m.state===filter));
 $("heading").textContent=sport==="all"?"All sports":sport[0].toUpperCase()+sport.slice(1);
 if(!rows.length){$("events").innerHTML='<div class="empty">No matches found for this filter. Try another sport or refresh later.</div>';return}
 $("events").innerHTML=rows.map(m=>`<article class="card"><div class="league">${icons[m.sport]} ${esc(m.league)} · ${m.sport.toUpperCase()}</div>
 <div class="match">${team(m.home,m.hl,icons[m.sport])}<div class="score"><span class="status">${esc(m.status)}</span><span class="scoreline">${m.hs!==""||m.as!==""?esc(m.hs||0)+" - "+esc(m.as||0):"VS"}</span></div>${team(m.away,m.al,icons[m.sport])}</div>
 <div class="meta">${esc(m.date||"Fixture time not provided")}</div></article>`).join("");
}
async function load(){
 $("updated").textContent="Updating…";
 const results=await Promise.allSettled(sports.map(async s=>{
  const r=await fetch(API+"?sport="+s+"&limit=50");if(!r.ok)throw Error(r.status);
  const j=await r.json();const list=Array.isArray(j)?j:(j.matches||j.data||j.events||[]);
  return list.map(x=>normalize(x,s));
 }));
 data=results.flatMap(r=>r.status==="fulfilled"?r.value:[]);
 const failures=results.filter(r=>r.status==="rejected").length;
 $("updated").textContent="Updated "+new Date().toLocaleTimeString();
 render();
 if(failures===sports.length){$("events").innerHTML='<div class="empty">Sports API unavailable. Check internet and try again.</div>';$("updated").textContent="Unavailable"}
 else if(failures)$("updated").textContent+=" · Some sports unavailable";
}
document.querySelectorAll(".sport").forEach(b=>b.onclick=()=>{document.querySelectorAll(".sport").forEach(x=>x.classList.remove("active"));b.classList.add("active");sport=b.dataset.sport;render()});
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
load();setInterval(load,90000);
</script></body></html>
